<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt App Prototype</title>
    
    <!-- Linked Sheets -->
    <link href="style.css" rel="stylesheet" />      
    <script src="script.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>

⁡⁣⁢⁢ <!-- B O D Y -->⁡
  <body>
    <!---------------- 🏠 H O M E   S C R E E N ---------------->
    <!-- B A C K   G R O U N D -->
    
    <div class="background home">
      <!-- H E A D E R - Container - Main -->
      <header class="header_container-home">
        <!-- Container 1 -->
        <div class="login_container-home">
          <img
            src="icons/login_icon.png"
            alt="login/register icon"
            class="login-icon"
            id="authIcon"
          />
          <div class="login-text">Login/Register</div>
        </div>

        <!-- Container 2 -->
        <div class="logo_container">
          <img src="logo/logo.png" alt="logo" class="logo" />
          <div class="logo-text">
            <span>See something wrong?</span>
            <span>Report it. Help fix it.</span>
          </div>
        </div>

        <!-- Container 3 -->
        <div class="menu_container">
          <img src="icons/menu.png" alt="menu icon" class="menu" />
        </div>
      </header>

⁡⁣⁢⁢<!-- M A I N -->⁡
        <main class="main-content home">
        <h1 class="heading_main--home">Welcome to FixIt</h1>
        <p class="subtext home">
          A quick, simple way to report problems in your city - like full bins,
          broken lights, or graffiti, You're helping restore our shared spaces.
        </p>
      </main>

    <section class="home-visual">
      <img src="icons/trees_icon.png" alt="tree icon" class="icon tree">
      <img src="icons/bench_icon.png" alt="bench icon" class="icon bench">
      <img src="icons/graffiti_icon.png" alt="graffiti icon" class="icon graffiti">
      <img src="icons/paths_icon.png" alt="path icon" class="icon path">
      <img src="icons/lights_icon.png" alt="light icon" class="icon light">
      <img src="icons/bins_icon.png" alt="bin icon" class="icon bin">
      <img src="icons/pothole - icon.png" alt="pothole icon" class="icon pothole">
    </section>
     
   
      ⁡⁣⁢⁢  <!-- FOOTER -->⁡
      <footer class="footer-home">
        <h2>&copy; 2025 FixIt. All rights reserved</h2>
      </footer>
    </div>
  </body>
</html>
