<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt App Prototype</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!---------------- 📌 L O C A T I O N   S C R E E N ---------------->
    <!-- B A C K   G R O U N D -->
    <div class="app-wrapper background other">
      <!-- H E A D E R - Container - Main -->
      <header class="header_container">
        <!-- Container 1 -->
        <div class="login_container">
          <img
            src="icons/login_icon.png"
            alt="login/register icon"
            class="login-icon"
            id="authIcon"
          />
          <div class="login-text">Login/Register</div>
        </div>

        <!-- Container 2 -->
        <div class="logo_container">
          <img src="logo/logo.png" alt="logo" class="logo" />
          <div class="logo-text">
            <span>See something wrong?</span>
            <span>Report it. Help fix it.</span>
          </div>
        </div>

        <!-- Container 3 -->
        <div class="menu_container">
          <img src="icons/menu.png" alt="menu icon" class="menu" />
        </div>
      </header>
      <!-- ------------------------------------------------------------------ -->
      <!-- PROGRESS BAR -->
      <div class="progress-wrapper">
        <span class="progress-label">Step 2</span>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
      <!-- ------------------------------------------------------------------ -->
      <!-- CONTAINER MAIN - Main Content - Report Issue Screen -->
      <main></main>
      <!-- FOOTER -->
      <footer class="footer-location">
        <div class="footer-inner">
          <button class="btn next-button">Next</button>
        </div>
      </footer>
    </div>
  </body>
</html>
