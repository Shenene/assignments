    <style>
      /* ------------------------ Stars Rating's CSS ------------------------ */
      .star-rating {
        direction: rtl;
        display: inline-block;
        cursor: pointer;
      }

      .star-rating input {
        display: none;
      }

      .star-rating label {
        color: #ddd;
        font-size: 24px;
        padding: 0 2px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .star-rating label:hover,
      .star-rating label:hover ~ label,
      .star-rating input:checked ~ label {
        color: #ffc107;
      }
      /* ---------------------------------------------------------------------- */
      .loginbtn {
        display: flex;
        justify-content: center;
        height: 2rem;
        width: 2rem;
        padding: 0.2rem;
        border: #007d1f;
        outline: auto;
      }

      .loginbtn:hover {
        display: flex;
        background-color: #2effb6;
        outline: auto;
      }

      .icon-btn-nav {
        display: flex;
        justify-content: center;
        height: 2rem;
        width: 2rem;
        padding: 0.1rem;
        border: #396444;
        outline-offset: 0.1rem;
      }
      .icon-btn-nav:hover {
        display: flex;
        background-color: #2effb6;
        outline: auto;
      }
      .logoo {
        display: flex;
        justify-content: center;
        max-height: 6rem;
        max-width: 4rem;
        padding: 0.5rem;
      }
      .hamNavBar1 {
        background-color: rgb(170, 237, 134);
      }
      /* .hamNavBar2 {
  background-color: rgba(23, 131, 50, 0.806);
} */

        color: rgb(0, 32, 19);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: url("testhome_screen_bg.png") no-repeat center center fixed;
        background-size: cover;
      }
    </style>

    <!------------------------------------- (Feedback modal) ---------------------------------------------->
    <div class="modal" id="feedbackModal" tabindex="-1">
      <div class="modal-dialog">

          <!------------------------------- Modal Header --------------------------------------------->
          <div class="modal-header">

          </div>
          <!------------------------------- Modal Body (Feedback Form) ------------------------------>
          <div class="modal-body px-4 py-3">
            <form class="needs-validation w-100" novalidate>
              <div class="form-group mb-3">
                <textarea
                  class="form-control bg-light"
                  rows="3"
                  required
                  placeholder="Tell us what you think..."
                ></textarea>

                <!------------------------ Stars Rating ------------------------>
              </div>
              <div class="col-md-6">
                <div class="rating-card mb-4">
                  <div class="star-rating animated-stars">
                    <input type="radio" id="star5" name="rating" value="5" />
                    <label for="star5" class="bi bi-star-fill"></label>
                    <input type="radio" id="star4" name="rating" value="4" />
                    <label for="star4" class="bi bi-star-fill"></label>
                    <input type="radio" id="star3" name="rating" value="3" />
                    <label for="star3" class="bi bi-star-fill"></label>
                    <input type="radio" id="star2" name="rating" value="2" />
                    <label for="star2" class="bi bi-star-fill"></label>
                    <input type="radio" id="star1" name="rating" value="1" />
                    <label for="star1" class="bi bi-star-fill"></label>
                  </div>

                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Send Feedback

            </form>

          <!------------------------------- Star Modal Footer -------------------------------------------->

    <!------------------------------------- login modal ---------------------------------------------->
    <div class="modal" id="LoginModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <!------------------------------- Modal Header --------------------------------------------->
          <div class="modal-header">
            <h5 class="modal-title">Login</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <!------------------------------- Modal Body (email & Password) --------------------------->
          <div class="modal-body">
            <form class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control bg-light"
                  id="loginEmail"
                  placeholder="name@example.com"
                  required
                />
                <div class="invalid-feedback">
                  Please Enter a valid email address
                </div>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control bg-light"
                  id="loginPassword"
                  placeholder="Password"
                  required
                />
                <div class="invalid-feedback">Please Enter your password</div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
          </div>

          <!------------------------------- Modal Footer -------------------------------------------->
          <div class="modal-footer justify-content-between">
            <small class="text-muted">
              Don’t have an account?
              <a href="timMission04/signup.html">Sign up</a>
            </small>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>

    <script>
      //------------------------ Login in & Form Validation  ------------------------
      document.addEventListener("DOMContentLoaded", () => {
        const forms = document.querySelectorAll(".needs-validation");

        forms.forEach((form) => {
          form.addEventListener("submit", (e) => {
            if (!form.checkValidity()) {
              e.preventDefault();
              e.stopPropagation();
            }

            form.classList.add("was-validated");
          });
        });
      });
      //------------------------ Stars Rating's Code ------------------------
      document
        .querySelectorAll(".star-rating:not(.readonly) label")
        .forEach((star) => {
          star.addEventListener("click", function () {
            this.style.transform = "scale(1.2)";
            setTimeout(() => {
              this.style.transform = "scale(1)";
            }, 200);
          });
        });
      //-----------------------------------------------------------------------
    </script>
