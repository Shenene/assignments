<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt App Prototype</title>

    <!-------------------- Linked Sheets -------------------->
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link href="global.css" rel="stylesheet" />
    <link href="location.css" rel="stylesheet" />

    <!-- JavaScript -->
    <script src="script.js" defer></script>
  </head>
  ⁡⁣⁢⁢
  <!-- B O D Y -->⁡
  <body>
    <!---------------- 📌 ⁡⁣⁣⁢L O C A T I O N   S C R E E N⁡ ---------------->

    <!-- B A C K   G R O U N D -->
    <div class="app-wrapper background other">
      <!-- H E A D E R - Container - Main -->
      <header class="header_container">
        <!-- Back Button (Arrow) -->
        <div class="back-button">
          <button class="btn-back">
            <img src="icons/back_arrow.png" alt="Go back" class="back-icon" />
          </button>
        </div>

        <!-- Container 1 -->
        <div class="login_container">
          <img src="icons/login_icon.png" alt="login/register icon" class="login-icon" id="authIcon" />
          <div class="login-text">Login/Register</div>
        </div>

        <!-- Container 2 -->
        <div class="logo_container">
          <img src="logo/logo.png" alt="logo" class="logo" />
          <div class="logo-text">
            <span>See something wrong?</span>
            <span>Report it. Help fix it.</span>
          </div>
        </div>

        <!-- Container 3 -->
        <div class="menu_container">
          <img src="icons/menu.png" alt="menu icon" class="menu" />
        </div>
      </header>

      <!-- ------------------------------------------------------------------ -->
      <!-- PROGRESS BAR -->
      <div class="progress-wrapper">
        <span class="progress-label">Step 2</span>
        <div class="progress-bar">
          <div class="progress-fill-step2"></div>
        </div>
      </div>

      <!-- ------------------------------------------------------------------ -->
      <!-- P A G E   H E A D I N G (h1)-->
      <div class="page-heading-wrapper">
        <h1 class="heading_main report-issue">Location</h1>
      </div>

      ⁡⁣⁢⁢<!-- M A I N -->⁡
      <div class="content-wrapper location-wrapper">
        <main class="main-content">
          <!-- MAP MOCKUP -->
          <div class="map-mockup">
            <img src="images/laptop-map_mockup.png" alt="map showing location on street grid" class="map-img" />
          </div>
          <!-- SEARCH LOCATION -->
          <div class="search-location">
            <label for="location-search" class="visually-hidden">Search address or place name</label>
            <input type="text" id="location-search" name="location" placeholder="Search address or place name" class="input--search-location" />
            <div class="location-info">Use your current location or search for a different one</div>
            <button class="btn btn-search">Search</button>
          </div>
        </main>
      </div>

      ⁡⁣⁢⁢
      <!-- FOOTER -->⁡
      <footer class="footer footer-location">
        <div class="footer-inner">
          <!-- Next Button -->
          <button class="btn next-button">
            Next
            <img src="icons/next_arrow.png" alt="" class="btn-icon-next" aria-hidden="true" />
          </button>
        </div>
      </footer>
    </div>
  </body>
</html>
