<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt App Prototype</title>
    
     <!-------------------- Linked Sheets -------------------->
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link href="global.css" rel="stylesheet" />
    <link href="report-lights.css" rel="stylesheet" />

    <!-- JavaScript -->
    <script src="script.js" defer></script>
  </head>

⁡⁣⁢⁢ <!-- B O D Y -->⁡
  <body>
    <!---------------- 📑 R E P O R T   I S S U E   S C R E E N  * 💡 L I G H T S ---------------->
    <!-- B A C K   G R O U N D -->
    <div class="app-wrapper background other">
      
      <!-- H E A D E R - Container - Main -->
      <header class="header_container">

        <!-- Back Button (Arrow) -->
        <div class="back-button">
          <button class="btn-back">
            <img src="icons/back_arrow.png" alt="Go back" class="back-icon" />
          </button>
        </div>

        <!-- Container 1 -->
        <div class="login_container">
          <img
            src="icons/login_icon.png"
            alt="login/register icon"
            class="login-icon"
            id="authIcon"
          />
          <div class="login-text">Login/Register</div>
        </div>

        <!-- Container 2 -->
        <div class="logo_container">
          <img src="logo/logo.png" alt="logo" class="logo" />
          <div class="logo-text">
            <span>See something wrong?</span>
            <span>Report it. Help fix it.</span>
          </div>
        </div>

        <!-- Container 3 -->
        <div class="menu_container">
          <img src="icons/menu.png" alt="menu icon" class="menu" />
        </div>
      </header>

      <!-- ---------------------------------------------- -->
      <!-- P R O G R E S S   B A R -->
       <div class="content-wrapper">
      <div class="progress-wrapper">
        <span class="progress-label">Step 1</span>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <!-------------------------------------------------- -->
      <!-- P A G E   H E A D I N G (h1)-->
       <div class="page-heading-wrapper">
          <h1 class="heading_main report-issue">Lights</h1>
       </div>

      <!-- ----------------------------------------------- -->
    ⁡⁣⁢⁢ <!-- M A I N -->⁡
        <div class="content-wrapper">
        <main class="main-content report-issue">
      
          <fieldset class="issue-options">
            <legend class="visually-hidden">Type of light issue</legend>
            <!-- button 1 -->
            <button class="btn btn-flickering-light">
              <span class="label-flickering-light">Flickering light</span>
            </button>

            <!-- button 2 -->
            <button class="btn btn-light-off">
              <span class="label-light-off">Completely off</span>
            </button>

            <!-- button 3 -->
            <button class="btn btn-pole-damaged">
              <span class="label-pole-damaged">Pole damaged</span>
            </button>

            <!-- button 4 -->
            <button class="btn btn-light-other">
              <span class="label-light-other">Other</span>
            </button>

            <!-- user input field -->
            <div class="other-description">
              <label for="other-issue-detail" class="visually-hidden"
                >Describe the other issue</label
              >
              <input type="text" id="other-issue-detail"
              name="other-issue-detail" placeholder="Describe the other issue..." class="input-other"> </input>
            </div>
          </fieldset>

          <!-- Upload image section -->
          <section class="img-upload-container">
            <img
              class="upload-icon"
              src="images/drag_drop_img.svg"
              alt="Drag or drop to upload a photo"
            />
            <span class="subtext upload-instruction"
              >Drag & drop or click to upload</span
            >
            <span class="subtext optional-note">(Optional)</span>
          </section>
        </div>
      </main>
</div>
      <!-- ------------------------------------------------------------------ -->
      ⁡⁣⁢⁢<!-- FOOTER -->⁡
      <footer class="footer footer-lights">
        <div class="footer-inner">
          <!-- Next Button -->
             <button class="btn next-button">Next
            <img
              src="icons/next_arrow.png"
              alt="" class="btn-icon-next" aria-hidden="true"/>
          </button>
        </div>
      </footer>
    </div>
  </body>
</html>
