<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt App Prototype</title>

    <!-------------------- Linked Sheets -------------------->
    <link href="report-lights.css" rel="stylesheet" />
    <link href="global.css" rel="stylesheet" />

    <script src="script.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  </head>

  ⁡⁣⁢⁢<!-- B O D Y -->⁡
  <body>
    <!-- TEST ONLY - <a href="#main-content" style="background:yellow;z-index:99999;position:absolute;">Skip to main content</a> -->
    <!-- For Accessibility - Keyboard users can skip directly to the main content -->
    <a href="#main-content" class="visually-hidden focusable">Skip to main content</a>

    <!---------------- 📑 ⁡⁢⁣⁢R E P O R T   I S S U E   S C R E E N  * 💡 L I G H T S⁡ ---------------->
    <!-- B A C K   G R O U N D -->
    <div class="app-wrapper background other">
      <!-- H E A D E R - Container - Main -->
      <header class="header_container">
        <!-- Back Button (Arrow) -->
        <div class="back-button">
          <button class="btn-back" onclick="window.history.back()">
            <img src="icons/back_arrow.png" alt="Go back" class="back-icon" />
          </button>
        </div>

        <!-- Container 1 -->
        <div class="login_container">
          <button class="button_login"><img src="icons/login_icon.png" alt="login/register icon" class="login-icon" id="authIcon" /></button>
          <div class="login-text">Login/Register</div>
        </div>

        <!-- Container 2 -->
        <div class="logo_container">
          <img src="logo/logo.png" alt="logo" class="logo" />
          <div class="logo-text">
            <span>See something wrong?</span>
            <span>Report it. Help fix it.</span>
          </div>
        </div>

        <!-- Container 3 -->
        <div class="menu_container">
          <button class="button_menu"><img src="icons/menu.png" alt="menu icon" class="menu" /></button>
        </div>
      </header>

      <!-- ---------------------------------------------- -->
      <!-- P R O G R E S S   B A R -->
      <div class="content-wrapper">
        <div class="progress-wrapper">
          <span class="progress-label">Step 1</span>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
        </div>

        <!-------------------------------------------------- -->
        <!-- P A G E   H E A D I N G (h1)-->
        <div class="page-heading-wrapper">
          <h1 class="heading_main report-issue">Lights</h1>
        </div>

        <!-- ----------------------------------------------- -->
        ⁡⁣⁢⁢
        <!-- M A I N -->⁡
        <main id="main-content" class="main-content report-issue">
          <div class="content-wrapper">
            <!-- Accessibility - Fieldset + Legend (screen reader will announce the legend before naming the buttons)  -->
            <fieldset class="issue-options">
              <legend class="visually-hidden">Type of light issue</legend>
              <!-- button 1 -->
              <button class="btn btn-flickering-light">
                <span class="label-flickering-light">Flickering light</span>
              </button>

              <!-- button 2 -->
              <button class="btn btn-light-off">
                <span class="label-light-off">Completely off</span>
              </button>

              <!-- button 3 -->
              <button class="btn btn-pole-damaged">
                <span class="label-pole-damaged">Pole damaged</span>
              </button>

              <!-- button 4 -->
              <button class="btn btn-light-other" type="button" id="btn-other">
                <span class="label-light-other">Other</span>
              </button>

              <!-- user input field -->
              <div class="other-description" id="other-desc" style="display: none">
                <label for="other-issue-detail" class="visually-hidden">Describe the other issue</label>
                <input type="text" id="other-issue-detail" name="other-issue-detail" maxlength="120" placeholder="Describe the other issue..." class="input-other" />
                <span id="char-count" class="char-count">120 characters left</span>
              </div>
            </fieldset>

            <!-- Upload image section -->
            <section class="img-upload-container" id="img-upload-container">
              <label for="upload-photo" class="upload-label"
                ><img class="upload-icon" src="images/drag_drop_img.svg" alt="Drag or drop to upload a photo" tabindex="0" />
                <span class="subtext upload-instruction">Drag & drop or click to upload</span>
                <span class="subtext optional-note">(Optional)</span>
                <input type="file" id="upload-photo" class="input-file" accept="image/*" style="display: none" tabindex="-1" aria-label="Upload photo" />
              </label>
              <img id="photo-preview" class="photo-preview" src="" alt="Selected image preview" style="display: none; max-width: 220px; margin-top: 1rem" />
            </section>
          </div>
        </main>
      </div>

      <!-- ------------------------------------------------------------------ -->
      ⁡⁣⁢⁢<!-- FOOTER -->⁡
      <footer class="footer footer-lights">
        <div class="footer-inner">
          <!-- Next Button -->
          <a href="location.html" class="btn next-button" id="next-to-location"
            >Next
            <img src="icons/next_arrow.png" alt="" class="btn-icon-next" aria-hidden="true" />
          </a>

          <!-- Better to use a tags for navigation instead of button (unless submitting a form) apparently better for accessibility & semantics -->
          <!-- <button class="btn next-button" onclick="window.location.href='location.html'">Next
            <img
              src="icons/next_arrow.png"
              alt="" class="btn-icon-next" aria-hidden="true"/>
          </button> -->
        </div>
      </footer>
    </div>

    <div id="photo-modal" class="photo-modal" style="display: none">
      <div class="photo-modal-content">
        <span id="close-modal" class="close">&times;</span>
        <h2>Preview your uploaded photo</h2>
        <img id="modal-photo" src="" alt="Preview photo" style="max-width: 90%; margin: 1em 0" />
        <div>
          <button id="discard-photo" class="btn">Discard</button>
          <button id="keep-photo" class="btn">Keep</button>
        </div>
      </div>
    </div>
  </body>
</html>
