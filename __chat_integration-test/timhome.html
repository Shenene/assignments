<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Hamburger Slide-In Nav</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      /* ------------------------ Stars Rating's CSS ------------------------ */
      .star-rating {
        direction: rtl;
        display: inline-block;
        cursor: pointer;
      }

      .star-rating input {
        display: none;
      }

      .star-rating label {
        color: #ddd;
        font-size: 24px;
        padding: 0 2px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .star-rating label:hover,
      .star-rating label:hover ~ label,
      .star-rating input:checked ~ label {
        color: #ffc107;
      }
    </style>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <!------------------------------- Navbar with hamburger button -------------------------------------->

    <nav class="navbar navbar-light">
      <div
        class="container-fluid d-flex justify-content-between align-items-start"
      >
        <button
          class="btn loginbtn"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#LoginModal"
        >
          <img src="loginbtn.svg" alt="login In btn" />
        </button>

        <!-- <a href="timhome.html" class="btn">-->
        <img class="logoo" src="Logo.svg" alt="Logoo" />

        <button
          class="btn btn-outline-dark"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasRight"
          aria-controls="offcanvasRight"
        >
          &#9776;
        </button>
      </div>
    </nav>

    <!------------------------------- Offcanvas Menu (slides in from right) ---------------------------->
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="offcanvasRight"
      aria-labelledby="offcanvasRightLabel"
    >
      <!--Header -->
      <!-- <div class="offcanvas-header">
        <h3 class="offcanvas-title px-4 fw-bold" id="offcanvasRightLabel">
          Menu
        </h3>
        <button
          type="button"
          class="btn-close btn-close-dark"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div> -->

      <!-- Body -->
      <div class="offcanvas-body d-flex p-0 hamNavBar2">
        <ul class="nav flex-column gap-3 px-2 py-4 hamNavBar1">
          <!-- Home btn -->
          <li class="nav-item">
            <a
              href="timhome.html"
              class="btn btn-outline-success d-flex icon-btn-nav"
            >
              <img src="house_icon.svg" alt="home-icon-svg" />
            </a>
          </li>
          <!-- Reports btn -->
          <li class="nav-item">
            <a href="#" class="btn btn-outline-success d-flex icon-btn-nav">
              <img src="report_icon.svg" alt="Report-icon-svg" />
            </a>
          </li>
          <!-- Feedback btn -->
          <li class="nav-item">
            <button
              type="button"
              class="btn btn-outline-success d-flex icon-btn-nav"
              data-bs-toggle="modal"
              data-bs-target="#feedbackModal"
            >
              <img src="feedback_icon.svg" alt="feedback-icon-svg" />
            </button>
          </li>
          <!-- Chat FAQs btn -->
          <li class="nav-item">
            <a href="#" class="btn btn-outline-success d-flex icon-btn-nav">
              <img src="Chatbot.svg" alt="chatbot-icon-svg" />
            </a>
          </li>
        </ul>
        <!-- Next--------------------------------------------------------------------------- -->

        <ul class="nav flex-column gap-2 px-1 py-4">
          <!-- Home btn -->
          <li class="nav-item">
            <a href="timhome.html" class="btn d-flex nav-bar-text"> Home </a>
          </li>
          <!-- Reports btn -->
          <li class="nav-item">
            <a href="#" class="btn d-flex nav-bar-text"> All Report </a>
          </li>
          <!-- Feedback btn -->
          <li class="nav-item">
            <button
              type="button"
              class="btn d-flex nav-bar-text"
              data-bs-toggle="modal"
              data-bs-target="#feedbackModal"
            >
              Feedback
            </button>
          </li>
          <!-- Chat FAQs btn -->
          <li class="nav-item">
            <a href="#" class="btn d-flex nav-bar-text"> Chat FAQs </a>
          </li>
        </ul>
      </div>
    </div>

    <h4 class="d-flex justify-content-center align-items-center py-4">
      (Combine with shenene code after)
    </h4>
    <!------------------------------------- (Feedback modal) ---------------------------------------------->
    <div class="modal" id="feedbackModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <!------------------------------- Modal Header --------------------------------------------->
          <div class="modal-header">
            <h5 class="modal-title">We Would Love your feedback!</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <!------------------------------- Modal Body (Feedback Form) ------------------------------>
          <div class="modal-body px-4 py-3">
            <form class="needs-validation w-100" novalidate>
              <div class="form-group mb-3">
                <textarea
                  class="form-control bg-light"
                  rows="3"
                  required
                  placeholder="Tell us what you think..."
                ></textarea>

                <!------------------------ Stars Rating ------------------------>
              </div>
              <div class="col-md-6">
                <div class="rating-card mb-4">
                  <div class="star-rating animated-stars">
                    <input type="radio" id="star5" name="rating" value="5" />
                    <label for="star5" class="bi bi-star-fill"></label>
                    <input type="radio" id="star4" name="rating" value="4" />
                    <label for="star4" class="bi bi-star-fill"></label>
                    <input type="radio" id="star3" name="rating" value="3" />
                    <label for="star3" class="bi bi-star-fill"></label>
                    <input type="radio" id="star2" name="rating" value="2" />
                    <label for="star2" class="bi bi-star-fill"></label>
                    <input type="radio" id="star1" name="rating" value="1" />
                    <label for="star1" class="bi bi-star-fill"></label>
                  </div>
                  <p class="text-muted mt-2">Rate your experience</p>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Send Feedback
              </button>
            </form>
          </div>

          <!------------------------------- Star Modal Footer -------------------------------------------->
        </div>
      </div>
    </div>
    <!------------------------------------------------------------------------------------------------>

    <!------------------------------------- login modal ---------------------------------------------->
    <div class="modal" id="LoginModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <!------------------------------- Modal Header --------------------------------------------->
          <div class="modal-header">
            <h5 class="modal-title">Login</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <!------------------------------- Modal Body (email & Password) --------------------------->
          <div class="modal-body">
            <form class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control bg-light"
                  id="loginEmail"
                  placeholder="name@example.com"
                  required
                />
                <div class="invalid-feedback">
                  Please Enter a valid email address
                </div>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control bg-light"
                  id="loginPassword"
                  placeholder="Password"
                  required
                />
                <div class="invalid-feedback">Please Enter your password</div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
          </div>

          <!------------------------------- Modal Footer -------------------------------------------->
          <div class="modal-footer justify-content-between">
            <small class="text-muted">
              Don’t have an account? <a href="signup.html">Sign up</a>
            </small>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      //------------------------ Login in & Form Validation  ------------------------
      document.addEventListener("DOMContentLoaded", () => {
        const forms = document.querySelectorAll(".needs-validation");

        forms.forEach((form) => {
          form.addEventListener("submit", (e) => {
            if (!form.checkValidity()) {
              e.preventDefault();
              e.stopPropagation();
            }

            form.classList.add("was-validated");
          });
        });
      });
      //------------------------ Stars Rating's Code ------------------------
      document
        .querySelectorAll(".star-rating:not(.readonly) label")
        .forEach((star) => {
          star.addEventListener("click", function () {
            this.style.transform = "scale(1.2)";
            setTimeout(() => {
              this.style.transform = "scale(1)";
            }, 200);
          });
        });
      //-----------------------------------------------------------------------
    </script>
  </body>
</html>
